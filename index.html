const N = QUESTIONS.length;
const SUBJECTS = [...new Set(QUESTIONS.map(q=>q.subject))];
let S = {
  view: "landing",
  learner: {name:"", school:"", grade:"Grade 9", admission:""},
  answers: Array(N).fill(null),
  idx: 0,
  remaining: DURATION,
  hint: false,
  emailed: false,
  copied: false,
  elapsed: 0,
  timer: null
};

const $ = s=>document.querySelector(s);
function esc(t){return (t||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function letter(i){return String.fromCharCode(65+i)}
function fmt(sec){let m=Math.floor(sec/60), s=sec%60; return m+"m "+s+"s"}

function score(){
  let sc=0;
  QUESTIONS.forEach((q,i)=>{ if(S.answers[i]===q.correct) sc++; });
  return sc;
}
function subjStats(sub){
  let tot=0,corr=0;
  QUESTIONS.forEach((q,i)=>{
    if(q.subject!==sub) return; tot++;
    if(S.answers[i]===q.correct) corr++;
  });
  return {total:tot, correct:corr};
}
function level(pct){
  if(pct>=80) return {label:"Exceeding Expectation", cls:"exc", desc:"Excellent"};
  if(pct>=60) return {label:"Meeting Expectation", cls:"meet", desc:"Good"};
  if(pct>=40) return {label:"Approaching Expectation", cls:"app", desc:"Needs practice"};
  return {label:"Below Expectation", cls:"below", desc:"Requires support"};
}
function chips(){
  if(S.view==="landing") return '<div class="chip"><span class="dot"></span>'+N+' Questions</div><div class="chip">With Images</div>';
  let rem=S.remaining, low=rem<300;
  let a=S.answers.filter(v=>v!==null).length;
  if(S.view==="result") return '<div class="chip cnt">Teacher copy: '+esc(TEACHER_EMAIL)+'</div>';
  return '<div class="chip timer '+(low?'low':'')+'">⏱ '+fmt(rem)+'</div><div class="chip">'+a+'/'+N+' answered</div>';
}

function landing(){
  const colors=["#0f766e","#059669","#d97706","#dc2626","#7c3aed","#0e7490"];
  const cards = SUBJECTS.map((sub,i)=>{
    return '<div class="subj"><div class="ico" style="background:'+colors[i%colors.length]+'">'+(i+1)+'</div><b>'+esc(sub)+'</b><span>'+QUESTIONS.filter(q=>q.subject===sub).length+' Qs</span></div>';

  <div class="grid-landing">

      <h1>KJSEA Agriculture <span class="teal">with Images</span> Quiz</h1>
      <p class="lead">20 questions from 2025 Sample Paper Section A. 5 questions have embedded field pictures: soil conservation, poultry egg collection, suspended gardens, sweet potato vines, and cassava crisps value addition.</p>
      <div class="subjgrid">`+cards+`</div>
      <div class="notice">📸 Images are embedded in questions. No internet needed. Answers hidden until submit.</div>
    </div>
    <div class="dark"><div class="ic">🌱</div><div><b>How it works</b><span>60 min for 20 Qs. Click image to enlarge. Choose A-D. Hints available. Explanations only after submit.</span></div></div>
  </section>
  <section class="card"><div class="pad">
    <div class="row-h"><h2>Learner Details</h2><span class="tag">`+N+` Qs • 40 min</span></div>
    <div class="field"><label class="l">Full Name *</label><input id="f-name" class="inp" placeholder="e.g. Aisha Mwangi"></div>
    <div class="two"><div class="field"><label class="l">School</label><input id="f-school" class="inp" placeholder="e.g. Kalimoni JSS"></div>
    <div class="field"><label class="l">Admission No.</label><input id="f-adm" class="inp" placeholder="Optional"></div></div>
    <div class="field"><label class="l">Grade</label><div class="grades"><button class="gbtn on" data-a="grade" data-v="Grade 9">Grade 9</button><button class="gbtn" data-a="grade" data-v="Grade 8">Grade 8</button><button class="gbtn" data-a="grade" data-v="Grade 7">Grade 7</button></div></div>
    <button id="startBtn" class="btn primary full" data-a="start" disabled style="margin-top:20px">Start Quiz →</button>
  </div></section></div>`;
}

function quiz(){
  const q = QUESTIONS[S.idx];
  let dots = QUESTIONS.map((_,i)=>{
    let done=S.answers[i]!==null;
    let cur=i===S.idx;
    return '<button class="dotb '+(cur?'cur':'')+' '+(done?'done':'')+'" data-a="nav" data-i="'+i+'">'+(i+1)+'</button>';
  }).join("");

  let imgHtml = "";
  if(q.image){
    imgHtml = '<div class="qimg"><img src="'+q.image+'" alt="Question image" loading="lazy"><cap>📸 Study the picture above – tap to zoom</cap></div>';
  }

  let opts = q.options.map((op,i)=>{
    let sel=S.answers[S.idx]===i;
    return '<button class="opt '+(sel?'sel':'')+'" data-a="pick" data-i="'+i+'"><span class="let">'+letter(i)+'</span><span class="tx">'+esc(op)+'</span></button>';
  }).join("");

  let body = `
      <div class="qtext">`+(S.idx+1)+`. `+esc(q.q)+`</div>
      `+imgHtml+`
      <div class="hintrow"><button class="hbtn `+(S.hint?'on':'')+`" data-a="hint">💡 Hint</button> `+(S.answers[S.idx]!==null? '<span class="ans-tag">Answered: '+letter(S.answers[S.idx])+'</span>' : '')+`</div>
      `+(S.hint? '<div class="hint">'+esc(q.hint)+'</div>' : '')+`
      <div class="opts">`+opts+`</div>
    `;

  let a = S.answers.filter(v=>v!==null).length;
  let mini = SUBJECTS.map(sub=>{
    const t=subjStats(sub); return '<div><small>'+esc(sub)+'</small><b>'+t.correct+'/'+t.total+'</b></div>';
  }).join("");

  return `
  <div class="grid-quiz">
    <section class="card"><div class="qhead"><div class="who"><div><small>`+esc(q.subject)+`</small><b>Q`+(S.idx+1)+` of `+N+`</b></div></div><div class="pr"><div class="n">`+a+`/`+N+`</div><div class="bar"><i style="width:`+((S.idx+1)/N*100)+`%"></i></div></div></div>
      <div class="qbody"><div class="dots">`+dots+`</div>`+body+`
      <div class="navrow"><button type="button" class="btn ghost" data-a="prev" `+(S.idx===0?'disabled':'')+`>← Previous</button>
      `+(S.idx<N-1?'<button type="button" class="btn dark-b" data-a="next">Next →</button>':'<button type="button" class="btn primary" data-a="submit">Finish & Submit</button>')+`
      </div></div>
    </section>
    <aside class="side"><div class="box"><h4>Learner</h4><div class="nm">`+esc(S.learner.name)+`</div><div class="sub">`+esc(S.learner.school||"-")+` • `+esc(S.learner.grade)+`</div>
      <div class="mini">`+mini+`</div>
      <div class="prog"><div class="t"><span>Progress</span><span>`+a+`/`+N+`</span></div><div class="bar"><i style="width:`+(a/N*100)+`%"></i></div></div>
      <button type="button" class="btn amber full" style="margin-top:16px;padding:10px" data-a="submit">Submit Quiz</button>
      <div class="warn">Images: tap to view larger. Unanswered marked wrong.</div></div>
      <div class="tip"><small>CBC Tip</small><p>`+TIP_TEXT+`</p></div>
    </aside>
  </div>`;
}

function result(){
  const L=S.learner, s=score(), pct=Math.round(s/N*100), lv=level(pct);
  const sc=SUBJECTS.map(sub=>{const t=subjStats(sub);return '<div class="sc"><small>'+esc(sub)+'</small><b>'+t.correct+'/'+t.total+'</b><div class="bar"><i style="width:'+(t.correct/t.total*100)+'%"></i></div></div>';}).join("");
  const rv=QUESTIONS.map((q,i)=>{
    let ok=S.answers[i]===q.correct;
    let userAnsText=S.answers[i]!==null? letter(S.answers[i])+". "+q.options[S.answers[i]] : "Not answered";
    let correctText = letter(q.correct)+". "+q.options[q.correct];
    let imgHtml = q.image ? '<div class="qimg" style="margin-top:12px"><img src="'+q.image+'"><cap>Question image</cap></div>' : '';
    return '<div class="rv"><div class="top"><div class="mark '+(ok?'ok':'no')+'">'+(ok?'✓':'✕')+'</div><div>'+
      '<div class="meta"><small>Q'+(i+1)+' • '+esc(q.subject)+'</small><em class="'+(ok?'ok':'no')+'">'+(ok?'Correct':'Incorrect')+'</em></div>'+
      '<div class="q">'+esc(q.q)+'</div>'+imgHtml+'</div></div>'+
      '<div class="cmp"><div class="'+(ok?'g':'r')+'"><small>Your Answer</small><span>'+esc(userAnsText)+'</span></div>'+
      '<div class="g"><small>Correct Answer</small><span>'+esc(correctText)+'</span></div></div>'+
      '<div class="expl"><small>Explanation</small><p>'+esc(q.explanation)+'</p><small>Why other options are wrong</small><p class="w">'+esc(q.whyWrong)+'</p></div></div>';
  }).join("");
  return '<div style="display:grid;gap:24px"><div class="grid-res">'+
    '<section class="card"><div class="flag"></div><div class="pad">'+
      '<div class="hero"><div><span class="lvl '+lv.cls+'"><span class="d"></span>'+lv.label+'</span><h2>You scored '+s+'/'+N+'</h2><p>'+pct+'% • '+lv.desc+' • Time '+fmt(S.elapsed)+'</p></div>'+
      '<div class="levelbox"><small>CBC Level</small><b>'+lv.label+'</b><div class="bar"><i style="width:'+pct+'%"></i></div></div></div>'+
      '<div class="sgrid">'+sc+'</div>'+
      '<div class="btns"><button type="button" class="btn primary" data-a="email">📧 Email Results to Teacher</button>'+
      '<button type="button" class="btn ghost" data-a="download">⬇ Download Report</button>'+
      '<button type="button" class="btn dark-b" data-a="retake">↺ Retake Quiz</button></div>'+
      (S.emailed?'<div class="sent">Email app opened for <b>'+esc(TEACHER_EMAIL)+'</b>. If it did not open, copy the report.</div>':'')+
    '</div></section>'+
    '<aside class="side"><div class="box"><h4>Learner Summary</h4><div class="kv">'+
      '<div><span>Name</span><b>'+esc(L.name)+'</b></div><div><span>School</span><b>'+esc(L.school||"-")+'</b></div>'+
      '<div><span>Grade</span><b>'+esc(L.grade)+'</b></div><div><span>Admission</span><b>'+esc(L.admission||"N/A")+'</b></div>'+
      '<div><span>Date</span><b>'+esc(new Date().toLocaleString("en-KE",{timeZone:"Africa/Nairobi"}))+'</b></div></div></div>'+
    '<div class="box"><div class="copyrow"><h4>Teacher Report (copy)</h4><button type="button" data-a="copy">Copy Report</button></div>'+
      '<textarea class="rep" id="rep" readonly>'+esc(report())+'</textarea>'+(S.copied?'<div class="okmsg">Copied!</div>':'')+
      '</div></aside></div>'+
    '<section class="card review"><div class="hd row-h"><h3 style="font-size:18px;font-weight:600">Detailed Review & Explanations with Images</h3><span class="tag">'+s+' correct • '+(N-s)+' to review</span></div>'+rv+'</section></div>';
}

function report(){
  let o=[]; o.push("KJSEA AGRICULTURE & NUTRITION - 20 Qs WITH IMAGES");
  o.push("Learner: "+S.learner.name); o.push("School: "+(S.learner.school||"-")); o.push("Grade: "+S.learner.grade);
  o.push("Score: "+score()+"/"+N+" ("+Math.round(score()/N*100)+"%)");
  o.push("Time: "+fmt(S.elapsed));
  o.push(""); SUBJECTS.forEach(sub=>{const t=subjStats(sub); o.push(sub+": "+t.correct+"/"+t.total);});
  o.push(""); QUESTIONS.forEach((q,i)=>{
    let ans=S.answers[i]; let txt= ans!==null ? letter(ans)+". "+q.options[ans] : "Not answered";
    o.push((i+1)+". "+q.q+" | Your: "+txt+" | Correct: "+letter(q.correct)+". "+q.options[q.correct]);
  });
  o.push(""); o.push("Teacher Email: "+TEACHER_EMAIL);
  return o.join("\n");
}

function startQuiz(){
  S.view="quiz"; S.idx=0; S.remaining=DURATION; S.elapsed=0;
  S.answers=Array(N).fill(null);
  if(S.timer) clearInterval(S.timer);
  S.timer=setInterval(()=>{
    S.remaining=Math.max(0,S.remaining-1); S.elapsed++;
    document.getElementById("chips").innerHTML=chips();
    if(S.remaining===0){ finish(); }
  },1000);
  render();
}
function finish(){
  if(S.timer) clearInterval(S.timer);
  S.view="result"; render();
}
function emailTeacher(){
  S.emailed=true;
  const subject="Agri & Nutrition Quiz - "+S.learner.name+" - "+score()+"/"+N;
  window.location.href="mailto:"+TEACHER_EMAIL+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(report());
  render();
}
function render(){
  document.getElementById("chips").innerHTML = chips();
  document.getElementById("app").innerHTML = S.view==="landing"?landing():S.view==="quiz"?quiz():result();
}

document.getElementById("app").addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="f-name"){S.learner.name=e.target.value; const b=document.getElementById("startBtn"); if(b) b.disabled=!e.target.value.trim();}
  else if(id==="f-school") S.learner.school=e.target.value;
  else if(id==="f-adm") S.learner.admission=e.target.value;
});
document.getElementById("app").addEventListener("click",e=>{
  const t=e.target.closest("[data-a]"); if(!t) return;
  const a=t.dataset.a;
  if(a==="grade"){S.learner.grade=t.dataset.v; document.querySelectorAll(".gbtn").forEach(b=>b.classList.toggle("on",b.dataset.v===S.learner.grade)); return;}
  if(a==="start"){if(S.learner.name.trim()) startQuiz(); return;}
  if(a==="pick"){S.answers[S.idx]=+t.dataset.i; render(); return;}
  if(a==="nav"){S.idx=+t.dataset.i; S.hint=false; render(); return;}
  if(a==="prev"){S.idx=Math.max(0,S.idx-1); S.hint=false; render(); return;}
  if(a==="next"){S.idx=Math.min(N-1,S.idx+1); S.hint=false; render(); return;}
  if(a==="hint"){S.hint=!S.hint; render(); return;}
  if(a==="submit"){finish(); return;}
  if(a==="email"){emailTeacher(); return;}
  if(a==="retake"){S.view="landing"; S.answers=Array(N).fill(null); S.idx=0; S.remaining=DURATION; S.emailed=false; S.copied=false; window.scrollTo(0,0); render(); return;}
  if(a==="download"){
    const blob=new Blob([report()],{type:"text/plain"}), url=URL.createObjectURL(blob), l=document.createElement("a");
    l.href=url; l.download="Agri-Nutrition-Report-"+S.learner.name.replace(/\s+/g,"-")+"-"+score()+"of"+N+".txt";
    document.body.appendChild(l); l.click(); l.remove(); URL.revokeObjectURL(url); return;
  }
  if(a==="copy"){
    const txt=report(), done=()=>{S.copied=true; render(); setTimeout(()=>{S.copied=false; if(S.view==="result") render();},2000);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{document.getElementById("rep").select(); document.execCommand("copy"); done();});}
    else{document.getElementById("rep").select(); document.execCommand("copy"); done();}
  }
});

document.getElementById("setup-mail").textContent=TEACHER_EMAIL;
document.getElementById("foot-mail").textContent=TEACHER_EMAIL+" receives results";
render();
</script>
</body>
</html>
