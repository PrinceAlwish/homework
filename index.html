3","12/13","5/12","13/12"],correct:1,explanation:"Using Pythagoras, BC = √(13² - 5²) = 12 cm. Therefore, sin A = Opposite/Hypotenuse = 12/13.",whyWrong:"5/13 is cos A, 5/12 is tan A, 13/12 is cosecant (inverse).",hint:"First use Pythagoras to calculate missing side BC opposite angle A, then sin = Opposite/Hypotenuse."},{id:5,subject:"Mathematics",q:"A semi-circular garden has a diameter of 14 m. What is the total perimeter of the garden? (Take π = 22/7).",options:["36 m","22 m","44 m","50 m"],correct:0,explanation:"Curved arc length = (22/7 × 14)/2 = 22 m. Add the straight diameter edge: 22 + 14 = 36 m.",whyWrong:"22 m is only curved part, 44 m is full circle, 50 m exceeds actual perimeter.",hint:"Remember perimeter of a semicircle includes both curved arc and straight diameter."},{id:6,subject:"Integrated Science",q:"Which of the following separation methods is most suitable for separating a miscible mixture of water and ethanol (alcohol)?",options:["Filtration","Decantation","Simple evaporation to dryness","Fractional distillation"],correct:3,explanation:"Fractional distillation separates miscible liquids based on differences in their boiling points.",whyWrong:"Filtration is for insoluble solids, decantation for immiscible layers, evaporation loses one component.",hint:"Think of a technique used when two liquids dissolve completely but boil at distinct temperatures."},{id:7,subject:"Integrated Science",q:"Which part of the human alimentary canal is primarily adapted for the absorption of digested food nutrients into the bloodstream?",options:["Small intestine","Stomach","Large intestine","Esophagus"],correct:0,explanation:"The small intestine contains villi and microvilli that provide a massive surface area for nutrient absorption.",whyWrong:"Stomach stores/digests protein, large intestine absorbs water, esophagus only transports.",hint:"Look for the long, coiled part of the digestive tract lined with tiny finger-like structures called villi."},{id:8,subject:"Integrated Science",q:"An object of mass 10 kg is lifted vertically to a height of 5 m above the ground. Calculate the gravitational potential energy gained (g = 10 m/s²).",options:["50 J","500 J","250 J","1000 J"],correct:1,explanation:"Potential energy PE = m × g × h = 10 kg × 10 m/s² × 5 m = 500 J.",whyWrong:"50 J fails multiplication across three factors, 250 J is half, 1000 J is double.",hint:"Use PE = mgh, multiplying mass, gravity, and height together."},{id:9,subject:"Integrated Science",q:"In a typical terrestrial food chain, which organism represents a primary consumer?",options:["Hawk","Lion","Grasshopper","Frog"],correct:2,explanation:"A grasshopper feeds directly on green plants (producers), classifying it as a primary consumer (herbivore).",whyWrong:"Hawk and lion are carnivores, frog eats insects = secondary consumer.",hint:"A primary consumer is an organism that feeds directly on plants for energy."},{id:10,subject:"Integrated Science",q:"When heating a liquid in a test tube using a Bunsen burner, which safety rule must be followed?",options:["Point the mouth of the test tube directly toward your lab partner.","Seal the top of the test tube tightly with a rubber bung.","Heat only the extreme top portion of the liquid column.","Point the mouth of the test tube away from yourself and others."],correct:3,explanation:"Directing the opening away from everyone prevents hot spurts or boiling liquid from causing injuries.",whyWrong:"Pointing at partner is dangerous, sealing builds pressure and explodes, heating top causes spurts.",hint:"Consider where unexpected bubbling might eject hot liquid if it boils over quickly."},{id:11,subject:"Pre-Technical Studies",q:"Which workshop safety sign category features a blue circular background with a white symbol, indicating a mandatory behavior or action?",options:["Mandatory safety sign","Prohibition sign","Warning sign","Emergency information sign"],correct:0,explanation:"Blue circular signs instruct workers on mandatory safety gear or procedures, such as wearing goggles.",whyWrong:"Prohibition = red border with diagonal, warning = yellow triangle, emergency = green background.",hint:"Think about signs that tell you an action is required, such as wearing protective gear."},{id:12,subject:"Pre-Technical Studies",q:"Which hand tool is specifically used for testing the squareness (90° angle) of adjacent faces on a piece of timber?",options:["Marking gauge","Try square","Tenon saw","Spirit level"],correct:1,explanation:"A try square features a rigid steel blade fixed at a right angle to a stock, ideal for checking 90-degree squareness.",whyWrong:"Marking gauge scribes lines, tenon saw cuts, spirit level checks horizontal/vertical alignment.",hint:"This tool has a wooden or metal stock and a steel blade fixed at an exact right angle."},{id:13,subject:"Pre-Technical Studies",q:"Which of the following common engineering materials is classified as a non-ferrous metal?",options:["Mild steel","Cast iron","High carbon steel","Aluminium"],correct:3,explanation:"Aluminium does not contain iron as a base component, classifying it as a non-ferrous metal.",whyWrong:"Mild steel, cast iron, and high carbon steel all contain high iron = ferrous.",hint:"Non-ferrous metals contain little to no iron. Think lightweight, corrosion-resistant metals used in aircraft."},{id:14,subject:"Pre-Technical Studies",q:"When cutting across the grain of a piece of timber, which woodworking saw is most suitable?",options:["Cross-cut saw","Rip saw","Bow saw","Hacksaw"],correct:0,explanation:"A cross-cut saw is specifically designed with knife-like teeth angles to sever wood fibers cleanly across the grain.",whyWrong:"Rip saw cuts along grain, bow saw for rough pruning, hacksaw for metals.",hint:"The name directly references its function of cutting perpendicularly across wood fibers."},{id:15,subject:"Pre-Technical Studies",q:"In technical drawing, what type of line is represented by a thin, continuous line terminated w
